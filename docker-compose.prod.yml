name: nook-idp-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # 이름있는 볼륨. 컨테이너를 지워도 데이터는 남는다.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # 마이그레이션 — 일회성. 평소엔 뜨지 않는다(profiles).
  #
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml \
  #     --profile migrate run --rm --build migrate
  #
  # ⚠️ --build 를 빼면 안 된다. compose run 은 이미지가 있으면 그대로 쓴다.
  #    스키마는 이미지 안에 COPY 된 src 에서 읽으므로, 옛 이미지로 돌리면
  #    옛 스키마와 DB 를 비교해 "No changes detected" 를 내고 조용히 끝난다.
  # ---------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['migrate']
    restart: 'no'

  # ---------------------------------------------------------
  # RP(OAuth client) 등록 — 일회성. 평소엔 뜨지 않는다(profiles).
  #
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml \
  #     --profile seed run --rm --build seed
  #
  # ⚠️ 여기도 --build 필수. 등록할 client 목록이 이미지 안 스크립트에 들어있어,
  #    옛 이미지로 돌리면 옛 설정으로 등록된다.
  #
  # 멱등이다. 이미 같은 이름으로 등록된 client 는 건너뛴다.
  # ⚠️ 건너뛸 때 redirect_uris 는 갱신되지 않는다(로그아웃 설정만 갱신).
  #    콜백 주소를 바꾸려면 oauth_client 를 직접 UPDATE 하거나 row 를 지우고 재실행.
  # ---------------------------------------------------------
  seed:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN}
      WEB_URL: ${PUBLIC_ORIGIN}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # 이걸 안 주면 localhost 기본값으로 등록되어 운영에서 redirect_uri_mismatch.
      NOOK_OAUTH_CALLBACK_URIS: ${NOOK_OAUTH_CALLBACK_URIS}
      NOOK_POST_LOGOUT_REDIRECT_URIS: ${NOOK_POST_LOGOUT_REDIRECT_URIS}
      # back-channel logout 통지를 받을 RP 주소. client metadata 에 저장된다.
      # 이 값을 바꿨으면 seed 를 다시 돌려야 DB 에 반영된다.
      NOOK_BACKCHANNEL_LOGOUT_URI: ${NOOK_BACKCHANNEL_LOGOUT_URI}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['seed']
    restart: 'no'

  # ---------------------------------------------------------
  # IdP 서버 (NestJS)
  # ---------------------------------------------------------
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # 호스트가 아니라 컨테이너 이름 "postgres"로 부른다
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # ⚠️ 여기가 issuer의 근거가 되는 "공개 주소"다.
      # 브라우저가 실제로 접속할 수 있는 주소여야 한다.
      #
      # auth-web과 auth가 같은 오리진(PUBLIC_ORIGIN)을 쓴다. 경로로 나뉜다:
      #   /api/auth/*  → auth (이 컨테이너)
      #   그 외         → auth-web
      # 세션 쿠키를 그 한 호스트에 host-only로 묶기 위한 구성이다.
      # 호스트를 auth-web(id)과 auth(auth)로 쪼개면 쿠키가 auth 호스트에만
      # 저장되어 auth-web의 서버 컴포넌트가 세션을 못 읽고 로그인 화면으로
      # 되돌아온다.
      # 서브도메인 공유 쿠키(crossSubDomainCookies)로 우회할 수도 있지만,
      # 그러면 IdP 세션 토큰이 모든 서브도메인의 RP 서버로 함께 전송된다.
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN}
      WEB_URL: ${PUBLIC_ORIGIN}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # OTP 인증 코드 메일 발송. 둘 다 없으면 컨테이너가 부팅에서 죽는다
      # (mailer.ts 에서 의도적으로 fail-fast). 메일 없이는 아무도 가입을 못 끝낸다.
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    ports:
      # 외부 노출은 cloudflared 가 담당한다. 여기서는 127.0.0.1 에만 묶어
      # 서버에서 curl 로 찔러보는 용도로만 남긴다. 홈 네트워크에 열리지 않는다.
      - '127.0.0.1:${AUTH_HOST_PORT:-8081}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      # ⚠️ networks 를 명시하면 default 가 자동으로 안 붙는다. 빼먹으면
      #    postgres 를 못 찾아 부팅에서 죽는다.
      - default
      # back-channel logout 을 RP 로 POST 하기 위해 필요하다. 이게 없으면
      # auth 컨테이너가 nookbox-server 를 이름으로 찾지 못해 로그아웃 통지가
      # 조용히 실패한다(로그아웃 자체는 성공하므로 눈에 안 띈다).
      - nook-edge

  # ---------------------------------------------------------
  # auth-web — 로그인/동의 화면 (Next.js)
  # ---------------------------------------------------------
  auth-web:
    build:
      context: .
      dockerfile: apps/auth/web/Dockerfile
      args:
        # 브라우저가 auth를 부를 주소. 단일 오리진이므로 auth-web 주소와 동일하다.
        NEXT_PUBLIC_AUTH_URL: ${PUBLIC_ORIGIN}
        # 계정 페이지에서 NOOKBOX 랜딩으로 나가는 링크의 목적지.
        NEXT_PUBLIC_SERVICE_URL: ${SERVICE_ORIGIN}
    restart: unless-stopped
    environment:
      AUTH_INTERNAL_URL: http://auth:3001
    ports:
      # auth 와 같은 이유로 로컬 전용. 외부는 cloudflared 가 처리한다.
      - '127.0.0.1:${WEB_HOST_PORT:-8080}:3000'
    depends_on:
      - auth

  # ---------------------------------------------------------
  # Cloudflare Tunnel
  #
  # 인바운드 포트를 하나도 열지 않고 외부에 서비스를 노출한다.
  # cloudflared 가 Cloudflare 쪽으로 아웃바운드 연결을 맺고 그 위로 트래픽을 받는다.
  # 그래서 공유기 포트포워딩도, 고정 IP도, DDNS 도 필요 없다.
  #
  # 어느 호스트명을 어디로 보낼지(ingress)는 대시보드에서 설정한다:
  #   Zero Trust → 네트워크 → 터널 → macmini-home → 게시된 애플리케이션 경로
  #
  # 호스트마다 오리진은 하나만 쓰고 경로로 나눈다.
  # ⚠️ 순서가 중요하다. 위에서부터 먼저 매칭되므로 catch-all 을 반드시 맨 아래 둔다.
  #    (호스트가 다르면 서로 간섭하지 않는다. 순서는 같은 호스트 안에서만 문제다)
  #
  #   호스트명            경로                                    → 서비스
  #   ─────────────────────────────────────────────────────────────────────────
  #   id.nook-box.com    api/auth/*                              → auth:3001
  #   id.nook-box.com    .well-known/oauth-authorization-server/* → auth:3001
  #   id.nook-box.com    (비움 = catch-all)                        → auth-web:3000
  #   nook-box.com       api/auth/*                              → nookbox-server:4000
  #   nook-box.com       (비움 = catch-all)                        → nookbox-web:3030
  #
  # ⚠️ nookbox-* 는 이 compose 가 아니라 nookbox 레포의 스택이다(RP).
  #    아래 nook-edge 네트워크로만 만난다. nookbox 스택이 안 떠 있으면
  #    apex 로 들어온 요청은 502 가 된다. id.* 쪽은 영향 없다.
  #
  # ⚠️ nookbox 의 /users/* 같은 나머지 REST 는 뚫지 않는다.
  #    web 의 서버 컴포넌트가 컨테이너 안에서만 부르기 때문이다(server-only).
  #    브라우저가 직접 부르는 건 /api/auth/* 뿐이다.
  #
  # ⚠️ 두 번째 규칙을 빼먹지 말 것. main.ts 가 RFC 8414 규칙 때문에
  #    oauth-authorization-server 메타데이터를 /api/auth 밑이 아니라
  #    /.well-known/oauth-authorization-server/api/auth 에 붙인다.
  #    이 규칙이 없으면 그 경로가 Next 로 새서 404 가 되고,
  #    RP 의 OIDC discovery 가 조용히 실패한다.
  #
  # ⚠️ 대시보드 경로 입력란은 앞 슬래시를 넣지 않는다(`api/auth/*`).
  #
  # ⚠️ 예전의 auth.nook-box.com 규칙은 지운다. 남겨두면 그 호스트로 로그인했을 때
  #    쿠키가 다시 그쪽에 host-only 로 묶여 같은 증상이 재발한다.
  #
  # ⚠️ 대시보드에 넣는 주소는 호스트가 아니라 "컨테이너 이름:내부포트" 다.
  #    cloudflared 가 같은 compose 네트워크 안에 있어서 직접 닿는다.
  #    호스트에 launchd 데몬으로 설치하면(sudo cloudflared service install)
  #    compose 네트워크 밖이라 localhost:8080 을 써야 하니 혼동하지 말 것.
  # ---------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # --no-autoupdate: 컨테이너는 이미지 태그를 올려서 갱신하는 게 맞다.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - auth
      - auth-web
    networks:
      # ⚠️ networks 를 한 번이라도 명시하면 default 는 자동으로 안 붙는다.
      #    빼먹으면 auth/auth-web 을 못 찾아 id.* 가 통째로 죽는다.
      - default
      # nookbox(RP) 스택에 닿기 위한 공유 네트워크.
      - nook-edge

volumes:
  postgres-data:

networks:
  # nookbox 스택과 공유하는 네트워크. 양쪽 다 external 로 참조하므로
  # compose 가 만들어주지 않는다. 최초 1회 직접 만들어야 한다:
  #
  #     docker network create nook-edge
  #
  # external 로 둔 이유: 어느 스택을 먼저 띄우든 순서를 안 타게 하려는 것.
  # 한쪽이 소유하면 그쪽을 반드시 먼저 올려야 하고, down 하면 상대가 끊긴다.
  nook-edge:
    external: true
